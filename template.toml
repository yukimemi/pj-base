name = "pj-base"
version = "0.18.0"

# Language-agnostic boilerplate. Compose with `pj-rust` / `pj-go` /
# `pj-bun` for the language layer, and `pj-{rust,go,bun}-cli` for
# CLI-specific extras.

[[file]]
src = "LICENSE"
how = "overwrite"
when = "once"

# Agent guidance — `AGENTS.md` is the agent-agnostic source of
# truth (Codex reads it directly), `CLAUDE.md` / `GEMINI.md` are
# thin shims that auto-load tools still find. The base layer is
# the language-agnostic conventions block; pj-rust / pj-rust-cli
# add their own marker-bracketed sections in the same file.
[[file]]
src = "AGENTS.md.base"
dst = "AGENTS.md"
how = "merge-section"
when = "always"
marker = { begin = "<!-- kata:agents:base:begin -->", end = "<!-- kata:agents:base:end -->" }

[[file]]
src = "CLAUDE.md"
how = "overwrite"
when = "always"

[[file]]
src = "GEMINI.md"
how = "overwrite"
when = "always"

# opencode shim — same thin wrapper pointing back to AGENTS.md.
[[file]]
src = "OPENCODE.md"
how = "overwrite"
when = "always"

# Common .gitignore patterns. Kept inside a marker block so each
# project can append its own `.gitignore` lines outside the block
# without `kata apply` clobbering them.
[[file]]
src = ".gitignore.base"
dst = ".gitignore"
how = "merge-section"
when = "always"
marker = { begin = "# kata:gitignore:base:begin", end = "# kata:gitignore:base:end" }

# Common .gitattributes patterns. Same marker-section convention as
# .gitignore — projects can add their own attribute rules outside
# the kata block. The shipped block normalizes every text file to
# LF on commit (`* text=auto eol=lf`) so Windows-side writers
# (apm install, future tools) can't leak CRLF into the repo.
[[file]]
src = ".gitattributes.base"
dst = ".gitattributes"
how = "merge-section"
when = "always"
marker = { begin = "# kata:gitattributes:base:begin", end = "# kata:gitattributes:base:end" }

# Common .editorconfig rules — same marker-section convention as
# .gitignore/.gitattributes above, so `pj-rust` / future language
# layers can append their own file-type sections and projects can
# add their own outside the kata block. Complements `.gitattributes`
# (commit-time LF normalization) by pinning charset and line endings at
# EDIT time, so CRLF-vs-LF churn between contributors' editors stops
# before it reaches a commit. Scope is deliberately encoding + EOL only:
# indentation belongs to each language's formatter, which already runs in
# CI, and stating it twice only creates a second opinion that goes red on
# correctly formatted code. See the header of `.editorconfig.base` for the
# measurement that prompted narrowing it.
[[file]]
src = ".editorconfig.base"
dst = ".editorconfig"
how = "merge-section"
when = "always"
marker = { begin = "# kata:editorconfig:base:begin", end = "# kata:editorconfig:base:end" }

# APM consumer config. Tera-rendered so `name:` matches the
# project's directory name. Static otherwise — the only reason
# projects using these templates ship apm.yml is to vendor the renri skill.
# `dst` is spelled out even though kata's `.tera` opt-in
# convention would derive the same name; explicit reads better.
#
# `when = "once"` — first apply writes the consumer-default form,
# subsequent applies honour `once_applied = true` in
# `.kata/applied.toml` and skip. This lets *publisher* repos
# (yukimemi/renri being the canonical example) keep a hand-edited
# `apm.yml` with a real `version` and an empty
# `dependencies.apm: []` after one of two routes:
#   (a) restore the publisher form post-init and rely on
#       `once_applied = true` to keep it stable, or
#   (b) skip the bootstrap apm.yml on a fresh init for
#       publishers (workflow-side decision).
# Consumers who want to pick up future apm.yml.tera enhancements
# can `rm apm.yml && kata apply` to retrigger the once-write.
[[file]]
src = "apm.yml.tera"
dst = "apm.yml"
how = "overwrite"
when = "once"

# Seed the `apm install` output so a fresh `kata apply` doesn't
# leave the working tree in a state that every `renri add` (which
# runs `apm install` as a post_create hook) immediately dirties
# with untracked SKILL.md additions. `when = "once"` because the
# locked SKILL.md / lock-file state is now refreshed by the
# weekly `apm-bump.yml` workflow (auto-PR if upstream moves) and
# consumers can also manually `apm install --update && git
# commit` for a one-off bump; either way kata only seeds the
# initial state on first apply.
#
# `.agents/skills/renri/SKILL.md` and `.claude/skills/renri/SKILL.md`
# are byte-identical (apm copies the same SKILL.md to every
# requested target). Shipped as separate paths because each
# agent (Claude Code, Codex, …) loads from its own dir.
[[file]]
src = "apm.lock.yaml"
how = "overwrite"
when = "once"

[[file]]
src = ".agents/skills/renri/SKILL.md"
how = "overwrite"
when = "once"

[[file]]
src = ".claude/skills/renri/SKILL.md"
how = "overwrite"
when = "once"

# renri worktree config. Language-agnostic baseline: a single
# post_create hook that runs `apm install` so every fresh worktree
# installs the locked renri skill (idempotent — no lock churn).
# Upstream-refresh is handled by the weekly `apm-bump.yml`
# workflow, not this hook. Language layers (pj-rust, pj-go,
# pj-bun) overwrite this file with a richer hook that delegates
# to their build-system's on-add task.
# Source name carries the `.base` suffix for symmetry with
# `AGENTS.md.base` / `.gitignore.base` — same convention: layer
# suffix on every src that participates in compose conflicts.
#
# `merge-toml` keyed on `hooks.post_create[0]` (yukimemi/kata#108)
# so kata owns the first hook entry — the `apm install` skill
# install — and consumer projects can freely append their
# own `[[hooks.post_create]]` blocks without `kata apply`
# clobbering them. For Rust projects this directive is overridden
# by pj-rust's richer `cargo make on-add` chain (kata's last-
# layer-wins compose rule), so this path only fires for projects
# that use pj-base alone (future pj-go / pj-bun consumers).
# `ui.show_pr` stays kata-managed so the renri-list PR badge
# defaults stay uniform across projects using these templates.
# Requires kata >= 0.11.0; older kata silently no-ops on the
# bracket form.
[[file]]
src = "renri.toml.base"
dst = "renri.toml"
how = "merge-toml"
when = "always"
paths = ["ui.show_pr", "hooks.post_create[0]"]

# Gemini CLI settings — grant access to ~/wt so that worktrees
# created by renri (which live under ~/wt) are reachable by the
# Gemini agent. Applied as a project-level settings file so every
# project using these templates automatically inherits the permission.
[[file]]
src = ".gemini/settings.json"
dst = ".gemini/settings.json"
how = "overwrite"
when = "always"

# opencode settings — same rationale as Gemini above: allow the
# agent to read/write files inside renri worktrees under ~/wt.
# Uses `permission.external_directory` (opencode's mechanism),
# written as project-level `opencode.json`.
[[file]]
src = "opencode.json"
dst = "opencode.json"
how = "overwrite"
when = "always"

# Consumer-side Renovate config — a minimal extends-only file naming
# a kata layer, which Renovate resolves to that repo's `default.json`
# (Renovate's preset convention; the older fallback to
# `renovate.json` is deprecated). Every pj-* preset extends the layer
# below it, so one entry pulls in the whole chain and consumers get
# every rule — universal (auto-merge, GHA grouping, vars.toml
# customManager) and layer-specific (each layer disabling ITS OWN
# rendered workflows) — without copying anything inline.
#
# `when = "once"` for the file as a whole so consumers can layer
# their own customManagers / packageRules on top.
#
# The same `renovate.json` file doubles as pj-base's OWN Renovate
# config — Renovate searches for `renovate.json` (not `default.json`)
# when scanning a repo's own dependencies, so pj-base needs one
# locally too. The self-reference (`extends: ["github>yukimemi/pj-base"]`)
# loops back to `pj-base/default.json`, the canonical
# self-referencing preset pattern.
[[file]]
src = "renovate.json"
how = "overwrite"
when = "once"

# ...but `extends` itself stays kata-managed via a narrow `merge-json`
# sync, same ownership split as the `renri.toml` (`ui.show_pr`) and
# `.kata/vars.toml` (`actions.claude_code_action`) entries above.
#
# EVERY layer ships this same entry naming ITSELF, and kata's compose
# rule (last layer wins on file conflicts) then resolves `extends` to
# the topmost APPLIED layer automatically — no layer has to know what
# sits above it, and no preset var is needed. The `base` preset ends
# here and gets pj-base; `rust-cli` runs base -> rust -> rust-cli and
# ends up with pj-rust-cli.
#
# `when = "always"` rather than folding it into the `once` seed,
# because the layer-specific disable rules moved OUT of pj-base into
# each owning layer: a consumer whose `extends` still says
# `github>yukimemi/pj-base` would silently lose the `release.yml` /
# `ci.yml` disables that used to live here. This entry is what
# repairs those consumers on their next `kata apply`.
[[file]]
src = "renovate.json"
how = "merge-json"
when = "always"
paths = ["extends"]

# Daily-cadence `kata update + kata apply` workflow. Covers two
# kinds of drift between consumer state and template upstream:
# (1) `.kata/vars.toml` action-version pins bumped by Renovate's
# customManager, and (2) upstream pj-* template revs that
# evolve outside the consumer's local cache. Opens a rolling PR
# (`kata-apply/auto`) with the rendered-file diff and auto-merges
# when CI passes — if CI fails the PR stays open for review. When
# auto-merge can't be armed at all — no required checks, or none
# registered yet at that instant — the PR just stays open and the
# run still succeeds.
#
# `.tera` suffix keeps GitHub Actions from auto-running the
# source inside pj-base itself (GHA only invokes `.yml`/`.yaml`)
# AND opts the file into kata's Tera rendering so the workflow
# can reference `{{ vars.actions.checkout }}` etc. from
# `.kata/vars.toml`. kata strips the `.tera` suffix on apply —
# consumers receive `.github/workflows/kata-apply.yml`.
#
# Setup requirement on every consumer (one-time):
#   `KATA_APPLY_TOKEN` repo secret — classic PAT with `repo` +
#   `workflow` scope. Required because the auto-PR has to trigger
#   CI for the auto-merge gate to fire; GITHUB_TOKEN-opened PRs
#   skip downstream workflows by GitHub design, so the workflow
#   uses a PAT-owned identity instead.
#
# `when = "always"` because every consumer wants identical
# behaviour and fixes to the workflow itself need to flow
# automatically. Consumers who want to opt out can rename or
# delete the rendered file; kata will re-create it on next apply,
# so a real opt-out also means dropping the
# `[[file]] src = ".github/workflows/kata-apply.yml.tera"` entry
# locally — which is an explicit, documented action, not an
# accidental drift.
[[file]]
src = ".github/workflows/kata-apply.yml.tera"
dst = ".github/workflows/kata-apply.yml"
how = "overwrite"
when = "always"

# apm-bump — weekly cron that runs `apm install --update` and
# opens an auto-PR if `apm.lock.yaml` changed. The Renovate-
# equivalent for APM agent skills.
#
# Companion to the `renri.toml.base` change above: post_create
# now runs `apm install` (idempotent, no --update) so worktrees
# don't churn the lock; the upstream-refresh moves out of the
# `renri add` hot path and into this scheduled workflow.
#
# Same `.tera` suffix story as kata-apply.yml.tera — keeps GHA
# from auto-running the source inside pj-base while opting the
# file into kata's Tera rendering for the action-version pins.
# Same `KATA_APPLY_TOKEN` PAT requirement (auto-PR needs to fire
# CI for the auto-merge gate).
[[file]]
src = ".github/workflows/apm-bump.yml.tera"
dst = ".github/workflows/apm-bump.yml"
how = "overwrite"
when = "always"

# claude-review — automatic Claude Code review on every
# human-authored PR (replacement for the discontinued Gemini Code
# Assist free tier). Skips review-exempt PRs per the AGENTS.md
# "PR review cycle" rules: `chore/release-*` version bumps, the
# `kata-apply/auto` / `apm-bump/auto` rolling branches, and
# Renovate / Dependabot authors.
#
# Same `.tera` suffix story as kata-apply.yml.tera — keeps GHA
# from auto-running the source inside pj-base while opting the
# file into kata's Tera rendering for the action-version pins.
#
# Setup requirement on every consumer (one-time): the Claude
# GitHub App (github.com/apps/claude) installed on the repo, plus
# a `CLAUDE_CODE_OAUTH_TOKEN` secret generated via
# `claude setup-token` (Claude Pro/Max subscription). The secret
# half is now declared in the `[repo]` block at the end of this
# file and applied by kata; the App install stays manual.
[[file]]
src = ".github/workflows/claude-review.yml.tera"
dst = ".github/workflows/claude-review.yml"
how = "overwrite"
when = "always"

# claude — interactive `@claude` mention responder (PR / issue
# comments). Companion to claude-review above; fires only on
# explicit mentions, so no skip policy needed. Same one-time
# consumer setup (GitHub App + CLAUDE_CODE_OAUTH_TOKEN).
[[file]]
src = ".github/workflows/claude.yml.tera"
dst = ".github/workflows/claude.yml"
how = "overwrite"
when = "always"

# Action-version pins shared across kata-managed workflow
# templates. Universal scope: this layer's `kata-apply.yml.tera`
# uses `actions/checkout` and `peter-evans/create-pull-request`;
# pj-rust's `ci.yml.tera` reuses the same `actions/checkout` pin
# from here. Renovate's customManager scans this file (template
# root) and the consumer's `.kata/vars.toml` independently — the
# template-side bump flows down on next apply, the consumer-side
# bump is consumer-owned and survives apply via the once gate.
#
# Layered composition: pj-base ships universal pins as
# `overwrite, when=once`; pj-rust merges its `Swatinem/rust-cache`
# pin into the same `.kata/vars.toml` via `merge-toml, when=once`.
# Both fire on the first apply (yukimemi/kata#85 made
# `when = "once"` composable across multiple entries to the same
# dst), so the consumer's `.kata/vars.toml` ends up with the
# union of both layers' pins. Renovate then bumps in-place and
# kata's `once` gate keeps subsequent applies hands-off.
[[file]]
src = "vars.toml"
dst = ".kata/vars.toml"
how = "overwrite"
when = "once"

# Back-fill of the `claude_code_action` pin for ALREADY-INITIALIZED
# consumers. The seed entry above is `when = "once"`, so a key
# added to vars.toml after a consumer's first apply never reaches
# their `.kata/vars.toml` — and the claude workflow templates'
# `claude_code_action` reference would then fail kata's strict
# Tera render (undefined variable → `kata apply` aborts), breaking
# every existing consumer's daily kata-apply run.
#
# merge-toml with a narrow `paths` list is idempotent and
# non-clobbering: it only syncs the listed key, leaving the
# consumer-owned (Renovate-bumped) `checkout` /
# `create_pull_request` pins untouched — same ownership pattern as
# the `renri.toml.base` entry's `ui.show_pr`. `when = "always"`
# so the back-fill actually reaches consumers whose dst already
# exists (a `when = "once"` merge entry would be gated out by
# `once_applied = true`). Ownership consequence: this key is
# kata-managed in consumer repos — the canonical bump happens in
# pj-base's vars.toml and flows down on apply; consumer-side
# Renovate scanning of this dep is disabled in `default.json` to
# avoid a bump→revert cycle.
[[file]]
src = "vars.toml"
dst = ".kata/vars.toml"
how = "merge-toml"
when = "always"
paths = ["actions.claude_code_action"]
# ---------------------------------------------------------------------
# GitHub-side repository state.
#
# Not a file, so it is not a `[[file]]` entry — see yukimemi/kata#248
# for why `[repo]` is its own section rather than a `how`. kata reads
# the live repository, diffs against what is declared here, and
# converges: `kata status` shows the drift, `kata apply` fixes it,
# `kata status --all --repo` sweeps every registered project.
#
# Requires kata >= 0.17.0. Older kata silently no-ops on the whole
# block — nothing in the manifest schema uses `deny_unknown_fields` —
# so this is safe to ship ahead of everyone's upgrade, the same
# graceful-degradation story as the `merge-toml` bracket form above.
# ---------------------------------------------------------------------

[repo.settings]
# Merged branches were piling up in every repo, because this defaults
# to off and nothing ever turned it on. The local half (removing the
# worktree) is renri's job; this is the remote half.
delete_branch_on_merge = true

# The other half of the claude-review / claude workflows this layer
# ships, and the one that is easy to forget because nothing fails until
# a PR is opened.
#
# Installing the Claude GitHub App account-wide does NOT supply this.
# Actions secrets exist at repo / environment / organization scope
# only, and a personal account has no organization scope to inherit
# from — so every repository needs its own. yukimemi/tsumiki spent its
# first non-Renovate PR with `review` going red in about four seconds
# for exactly this reason, which is what prompted the kata feature.
#
# `get_env` rather than `KATA_VAR_*` / `vars.*` on purpose: vars are
# persisted into `.kata/applied.toml` and read back as a resolution
# source, so a token routed through them would land on disk in a
# committed file. No `default=` either — a missing variable should fail
# loudly, since a silently unset secret is the failure mode this whole
# entry exists to prevent.
#
# kata renders the value only for repositories that are actually
# missing the secret, so a machine that does not hold the token can
# still apply to every repository that already has it.
# The env var is deliberately NOT named after the secret: it is the
# name the operator's own shell profile defines, kept distinct from
# `CLAUDE_CODE_OAUTH_TOKEN` so the value is not picked up as ambient
# config by anything that looks for that name. Change it here only in
# step with that profile — a mismatch fails the apply rather than
# writing a wrong value, but the error will name the missing variable,
# not this line.
[[repo.secret]]
name = "CLAUDE_CODE_OAUTH_TOKEN"
value = '{{ get_env(name="Z_CLAUDE_CODE_OAUTH_TOKEN") }}'
