name: claude-review

# Hand-rendered twin of `claude-review.yml.tera` for pj-base's OWN
# PRs (dogfooding). pj-base ships the `.tera` source to consumers
# via kata but has no `.kata` state of its own, so nothing renders
# the template here — this copy is what actually runs in this repo.
# Keep it in sync when editing the `.tera` source. Version pins are
# inlined from `vars.toml` (`actions.checkout`,
# `actions.claude_code_action`); both are floating major tags, so
# drift risk is low. Renovate scanning of this path is disabled in
# `default.json` (consumer-side rule) — bumps flow via vars.toml.
#
# See the `.tera` source for the full rationale and the per-line
# skip-policy commentary.
#
# Setup (already required of consumers, same here): Claude GitHub
# App installed on the repo + `CLAUDE_CODE_OAUTH_TOKEN` secret from
# `claude setup-token`.

on:
  pull_request:
    types: [opened, ready_for_review, reopened]

permissions:
  contents: read
  pull-requests: write
  id-token: write

concurrency:
  # One review per PR at a time; a re-fire (reopen / ready)
  # supersedes an in-flight run (reviewing a stale diff is wasted
  # tokens).
  group: claude-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    # Skip release bumps, rolling bot branches, bot authors and
    # drafts — see the `.tera` source for the per-line rationale.
    if: |
      !github.event.pull_request.draft &&
      !startsWith(github.head_ref, 'chore/release-') &&
      github.head_ref != 'kata-apply/auto' &&
      github.head_ref != 'apm-bump/auto' &&
      github.event.pull_request.user.login != 'renovate[bot]' &&
      github.event.pull_request.user.login != 'dependabot[bot]'
    runs-on: ubuntu-latest
    # The action's SDK caps runs at 10 agent turns, but has no
    # wall-clock timeout of its own; bound a hung run well below
    # GHA's 360-minute default.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 1
          # The action exchanges its own App token for git/API
          # access; the checkout-persisted credential is unused.
          # Same hardening as apm-bump.yml.tera.
          persist-credentials: false

      - uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # Tracking comment with progress checkboxes; also pulls
          # full PR context (comments, attachments) into the run.
          track_progress: true
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}

            Review this pull request for correctness bugs first,
            then code quality. Follow the repository's AGENTS.md
            conventions where they apply.

            Focus areas, in priority order:
            - Correctness: logic errors, edge cases, error handling
            - Security: input validation, secrets handling
            - Maintainability: readability, duplication, dead code
            - Tests: coverage for the changed behaviour

            Post specific issues as inline comments on the relevant
            lines. Use one top-level comment for the overall
            summary. Be concise — no praise padding; if the PR is
            clean, say so briefly.
          # Scope Claude to read-the-PR + comment tools only; the
          # review job must not push code.
          claude_args: |
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*)"
