name: mirror-check

# pj-base's only workflow about pj-base itself.
#
# Everything else in this directory is either a template it ships
# (`*.yml.tera`) or a mirror of one. The mirrors exist because pj-base has
# no `.kata` state, so nothing renders them — and both drifted behind their
# templates before anyone noticed: one had lost the corepack step and the
# pnpm entries in `--allowedTools`, the other the author_association gate
# that keeps a stranger's `@claude` from starting a job holding this
# repository's token.
#
# `AGENTS.md.base` tells every consumer to write down facts duplicated
# across files with no compiler between them. This is that compiler, for
# the one such pair pj-base owns.
#
# Deliberately NOT named `ci.yml`: that name belongs to the language layers
# (pj-rust / pj-denops / pj-nvim render one into consumers), and Renovate's
# per-layer rule in `default.json` is written around who owns which
# filename. This workflow is pj-base's own and ships to nobody, so it takes
# a name no layer renders.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Reads the checkout and nothing else.
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  mirrors:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      # The script renders each template the way `kata apply` would —
      # reading the action pins from `vars.toml`, so a Renovate bump there
      # correctly fails this check until the mirrors are regenerated. That
      # is the point: a pin that moved for consumers but not for pj-base is
      # exactly the drift being guarded against.
      - run: sh scripts/workflow-mirrors.sh --check
